[project]
name = "manafold"
version = "0.1.0"
description = "Archetype classification for Magic: The Gathering decklists."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "flatbuffers==25.9.23",
  "numpy>=2.5.0",
  "onnx==1.22.0",
  "onnxruntime==1.28.0",
  "packaging==25.0",
  "psycopg[binary]>=3.2",
  "pyarrow>=18.0",
  "scipy>=1.18.0",
  "torch>=2.12.1",
]

[project.optional-dependencies]
notebook = [
  "ipykernel>=7.3",
  "matplotlib>=3.11",
  "nbclient>=0.11",
  "nbformat>=5.10",
  "pandas>=3.0",
  "scikit-learn>=1.9",
  "seaborn>=0.13",
]

[project.scripts]
manafold = "manafold.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manafold"]

[tool.ruff.format]
indent-style = "space"
