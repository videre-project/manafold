[project]
name = "manafold"
version = "0.1.0"
description = "Archetype classification experiments for Magic: The Gathering decklists."
readme = "README.md"
license = "OpenMDW-1.1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.5.0",
  "psycopg[binary]>=3.2",
  "pyarrow>=18.0",
  "torch>=2.12.1",
]

[project.scripts]
manafold = "manafold.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manafold"]
